[project]
name = "reharmonizer-core"
version = "0.1.0"
description = "Core music theory and chord substitution algorithms for the Reharmonizer application"
authors = [
    {name = "Reharmonizer Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "music21>=9.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reharmonizer_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
